name: Deploy Extend App

# Builds this repository's container image, pushes it to the Extend app's own
# registry, and deploys it. Runs on every push to main, or on demand.
#
# Setup lives in the README: three repository variables, two secrets, and a
# confidential IAM client with the permissions listed there.
#
# This file is yours to edit. Installing and authenticating AGS CLI is
# delegated to AccelByte/setup-ags-cli, because those steps carry runner-
# specific workarounds that are ours to maintain, not yours. Everything else —
# when to deploy, what to build, how to report — stays here in the open, so you
# can add tests, gates, environments, or a deploy matrix without waiting on us
# to add an input for it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to build and deploy (defaults to the commit SHA)'
        required: false

# Serialize deploys: only one runs at a time per branch. A new push waits for
# the in-flight deploy to finish instead of racing it — otherwise two rollouts
# to the same app could overlap and the older commit could win. cancel-in-progress
# is false on purpose: killing a rollout mid-flight can leave the app
# half-updated.
#
# Keep this block. `concurrency` is workflow-level only — it cannot live inside
# an action — so deleting it silently removes the protection with nothing to
# put it back.
concurrency:
  group: deploy-extend-app-${{ github.ref }}
  cancel-in-progress: false

env:
  # AGS CLI version to install. 'latest' resolves the newest release at run
  # time, so CLI fixes arrive without anyone editing this file.
  #
  # Two things to know about that. Builds stop being reproducible: re-running an
  # old commit installs today's CLI, not the one that commit was tested with, so
  # a rollback rebuilds with a different tool than the original deploy used. And
  # a CLI regression can reach your deploys without you choosing it.
  #
  # Pin an exact version (for example 0.5.3) if you need either guarantee.
  # Written without the 'AGS_VERSION:' prefix on purpose: the Renovate rule in
  # the README matches that prefix followed by a semver, and RE2 has no
  # lookbehind to exclude comments — so spelling it out here would have
  # Renovate opening pull requests that edit this comment.
  AGS_VERSION: 'latest'

  # The namespace the Extend app lives in.
  AGS_NAMESPACE: ${{ vars.AGS_NAMESPACE }}

  # Name of the Extend app to deploy to. The app must already exist — this
  # workflow deploys, it does not create.
  EXTEND_APP: ${{ vars.EXTEND_APP_NAME }}

  # Tag applied to the built image. Defaults to the commit SHA so every deploy
  # is immutable and traceable, and so rolling back is just re-running this
  # workflow against an older ref.
  IMAGE_TAG: ${{ inputs.image-tag || github.sha }}

  # How long to wait for the rollout to reach a terminal state before giving
  # up. Note this bounds the wait, not the deployment — a timeout does not
  # stop or roll back a rollout that is still in progress.
  WAIT_LIMIT: '600'

  # Seconds between rollout status polls.
  WAIT_INTERVAL: '10'

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    # Cap the whole job. WAIT_LIMIT only bounds the rollout step; without this a
    # hung image build would run until GitHub's 6-hour default kills it, burning
    # runner minutes. 30 minutes comfortably covers a normal build plus rollout.
    timeout-minutes: 30

    # This workflow only reads the repository. It never pushes commits, tags,
    # or releases, so nothing beyond read access is needed. (setup-ags-cli uses
    # the same default token to resolve the CLI version when `version` is set to
    # `latest`, which also needs only read.)
    permissions:
      contents: read

    steps:
      # Check out the repository. The Docker build context is the repository
      # root, so this has to happen before the image build.
      - uses: actions/checkout@v4

      # Fail fast on a misconfigured repository. Without this, a missing
      # variable surfaces as a confusing CLI error part-way through a deploy;
      # here it fails in seconds with a message naming exactly what is missing
      # and where to set it.
      #
      # setup-ags-cli validates its own inputs too, and that overlap is
      # deliberate. This step runs before anything is installed, and it can name
      # the exact GitHub settings page because it knows these values come from
      # repository variables and secrets — the action cannot know that, since
      # another caller might pass org variables or literals.
      - name: Check configuration
        env:
          # Read the secrets through the environment rather than interpolating
          # ${{ secrets.* }} straight into the script. Interpolation substitutes
          # the literal secret value into the command text before bash runs; the
          # env route keeps the value out of the script.
          AGS_BASE_URL: ${{ vars.AGS_BASE_URL }}
          AGS_CLIENT_ID: ${{ secrets.AGS_CLIENT_ID }}
          AGS_CLIENT_SECRET: ${{ secrets.AGS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          # "::error::" is a GitHub workflow command: echoing it both prints the
          # message and flags it as a red error annotation on the run summary,
          # so a misconfigured repo is obvious without scanning the logs.
          check() {
            if [ -z "${2:-}" ]; then
              echo "::error::Missing repository variable $1. Set it under Settings → Secrets and variables → Actions → Variables. $3"
              missing=1
            fi
          }
          check AGS_BASE_URL    "$AGS_BASE_URL"    "Example: https://dev.yourstudio.accelbyte.io"
          check AGS_NAMESPACE   "$AGS_NAMESPACE"   "Your game namespace."
          check EXTEND_APP_NAME "$EXTEND_APP"      "The name of an Extend app that already exists."
          if [ -z "${AGS_CLIENT_ID:-}" ] || [ -z "${AGS_CLIENT_SECRET:-}" ]; then
            echo "::error::Missing secret AGS_CLIENT_ID and/or AGS_CLIENT_SECRET. Create a confidential IAM client with the permissions listed in the README prerequisites, then store both under Settings → Secrets and variables → Actions → Secrets."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          echo "Deploying ${EXTEND_APP} to ${AGS_NAMESPACE} @ ${AGS_BASE_URL} as ${IMAGE_TAG}"

      # Add your tests here if you want them to gate the deploy. Anything that
      # exits non-zero stops the workflow before any image is built or pushed.
      #
      # - name: Test
      #   run: make test

      # Installs and caches AGS CLI, then logs in with the client credentials.
      #
      # Afterwards `ags` is on PATH and AGS_BASE_URL, AGS_HOME, AGS_PROFILE and
      # AGS_NO_KEYCHAIN are set for every later step, so the commands below are
      # plain CLI calls with no environment plumbing of their own. Those four
      # variables exist to work around things that are true of GitHub-hosted
      # runners — no OS keychain, no CLI state directory, a token that must stay
      # out of the Docker build context — and the action owns them so that a fix
      # reaches you by bumping a tag rather than by editing this file.
      #
      # Bumping AGS_VERSION at the top of this file is all it takes to move to a
      # new CLI — the action's cache key contains the version, so it misses and
      # reinstalls automatically.
      - name: Setup AGS CLI
        id: setup
        uses: AccelByte/setup-ags-cli@v1
        with:
          version: ${{ env.AGS_VERSION }}
          base-url: ${{ vars.AGS_BASE_URL }}
          client-id: ${{ secrets.AGS_CLIENT_ID }}
          client-secret: ${{ secrets.AGS_CLIENT_SECRET }}

      # Build the image and push it to the Extend app's own registry.
      #
      # --login mints the registry credentials from the session established by
      # setup-ags-cli, so there is no second set of registry credentials to
      # manage. --platform is pinned because an image built on arm64 starts
      # locally and then fails on the cluster with "exec format error".
      - name: Build and push image
        run: |
          set -euo pipefail
          ags extend image-upload \
            --namespace "$AGS_NAMESPACE" \
            --app "$EXTEND_APP" \
            --image-tag "$IMAGE_TAG" \
            --work-dir . \
            --dockerfile Dockerfile \
            --platform linux/amd64 \
            --login \
            --retry-limit 2

      # Create the deployment and poll until the rollout reaches a terminal
      # state or WAIT_LIMIT expires.
      #
      # `|| code=$?` captures the exit code without switching off `set -e` for
      # the rest of the script, so the Summary step below can report a specific
      # result.
      #
      # The `exit "$code"` on the last line is load-bearing: without it this
      # step succeeds even when the deploy failed, and the whole run goes green
      # on a broken deployment. Do not remove it.
      #
      # Each step runs in its own shell, so shell variables do not survive from
      # one step to the next. To pass data forward you append to the special
      # files GitHub provides: $GITHUB_OUTPUT (named step outputs, used here),
      # $GITHUB_STEP_SUMMARY (Markdown on the run page, used below), and
      # $GITHUB_ENV / $GITHUB_PATH (env vars and PATH for later steps, which
      # setup-ags-cli uses on your behalf).
      - name: Deploy and wait for rollout
        id: deploy
        run: |
          set -euo pipefail
          code=0
          # deploy-app is a shim onto the generated `csm deployments create`
          # operation, so the image tag goes in the request body rather than
          # a flag. (image-upload above is hand-written and takes --image-tag.)
          ags extend deploy-app \
            --namespace "$AGS_NAMESPACE" \
            --app "$EXTEND_APP" \
            --json "$(printf '{"imageTag":"%s"}' "$IMAGE_TAG")" \
            --wait --wait-limit "$WAIT_LIMIT" --wait-interval "$WAIT_INTERVAL" \
            --api-scope admin --api-version v5 \
            --format json --no-input --yes || code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Write the outcome to the run page so it is readable without opening the
      # logs. Runs on failure too, which is when it matters most.
      #
      # The exit codes come from AGS CLI:
      #   0  rollout completed, app healthy
      #   3  rollout reached a terminal failure
      #   6  WAIT_LIMIT elapsed — the rollout may still be in progress
      #
      # Code 6 is the one to read carefully: the deployment was not cancelled.
      # Check the app's status before redeploying, or you may stack a second
      # rollout on top of one that is still running.
      #
      # Replace this step with a Slack or Teams notification if you prefer —
      # nothing downstream depends on it.
      - name: Summary
        if: always()
        env:
          EXIT_CODE: ${{ steps.deploy.outputs.exit-code }}
          AGS_CLI_VERSION: ${{ steps.setup.outputs.version }}
        run: |
          case "${EXIT_CODE:-}" in
            0)  result='deployed' ;;
            3)  result='failed' ;;
            6)  result='timed out' ;;
            '') result='did not run' ;;
            *)  result="failed (exit ${EXIT_CODE})" ;;
          esac

          {
            echo "## Extend App Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`${EXTEND_APP}\` |"
            echo "| Namespace | \`${AGS_NAMESPACE}\` |"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| AGS CLI | \`${AGS_CLI_VERSION:-unknown}\` |"
            echo "| Result | ${result} |"
            case "${EXIT_CODE:-}" in
              3) echo ""; echo "> The rollout failed. Check the app logs before retrying." ;;
              6) echo ""; echo "> The wait timed out after ${WAIT_LIMIT}s. The deployment may still complete — check the app status before redeploying." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
